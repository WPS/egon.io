name: Deploy to Nais prod-gcp

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Nais image reference including sha256 digest, verified in dev-gcp"
        required: true
        type: string
      dev_verified:
        description: "Confirm dev functionality, ansatt access protection and removal of old ingress"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nais-prod-gcp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.dev_verified
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate image reference
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          if [[ ! "$IMAGE" =~ ^europe-north1-docker\.pkg\.dev/nais-management-[a-z0-9-]+/egon-io/egon\.io@sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Use an immutable image reference from the egon-io Nais registry."
            exit 1
          fi
      - uses: nais/setup@fb8692f65df9c904e2cdac5d395630ac876abdcf # v1.0.3
        with:
          team: egon-io
          version: v6.7.2
      - name: Deploy to prod-gcp
        env:
          IMAGE: ${{ inputs.image }}
        run: nais apply .nais/app.yaml --environment prod-gcp --set "spec.image=${IMAGE}" --wait
